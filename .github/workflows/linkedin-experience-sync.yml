name: Sync LinkedIn About to Work Experience

on:
  schedule:
    # Every Sunday at 1:30 PM IST (08:00 UTC) -> Cron: '0 8 * * 0'
    - cron: '0 8 * * 0'
  workflow_dispatch:
    inputs:
      about_text:
        description: 'Manual LinkedIn About text override (leave empty for automated extraction)'
        required: false
        type: string
        default: ''

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and repo write
permissions:
  contents: write
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-about-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      # Step 1: Extract LinkedIn About section and update Work Experience data layer
      - name: Sync LinkedIn About to Experience Layer
        run: node scripts/sync-linkedin-experience.cjs
        env:
          LINKEDIN_ABOUT_TEXT: ${{ github.event.inputs.about_text }}

      # Step 2: Auto-commit updated experience and profile data to repository
      - name: Commit Updated Experience Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain src/data)" ]; then
            git add src/data
            git commit -m "chore(sync): update Work Experience with latest LinkedIn About [skip ci]"

            # Resilient push with rebase and retry loop against race conditions
            SUCCESS=false
            TARGET_BRANCH="${GITHUB_REF_NAME:-master}"
            for i in {1..5}; do
              echo "Synchronizing with remote $TARGET_BRANCH (attempt $i/5)..."
              git fetch origin "$TARGET_BRANCH"
              git rebase -X theirs "origin/$TARGET_BRANCH" || git rebase --abort
              if git push origin "HEAD:$TARGET_BRANCH"; then
                echo "Successfully pushed data updates to $TARGET_BRANCH."
                SUCCESS=true
                break
              fi
              echo "Push rejected due to race condition. Retrying in 3s..."
              sleep 3
            done
            if [ "$SUCCESS" != "true" ]; then
              echo "Error: Failed to push data updates after 5 attempts."
              exit 1
            fi
          else
            echo "No experience data changes detected. Skipping git commit."
          fi

      # Step 3: Build Vite Production Bundle
      - name: Build Vite Application
        run: npm run build

      # Step 4: Configure & Upload to GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
